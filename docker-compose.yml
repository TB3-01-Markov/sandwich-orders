services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set it in .env}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      Database__Provider: SqlServer
      ConnectionStrings__DefaultConnection: "Server=db;Database=SandwichOrders;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Uploads__Path: /data/uploads
      Seed__Enabled: "true"
      Seed__StaffEmail: ${STAFF_EMAIL:-staff@example.test}
      Seed__StaffPassword: ${STAFF_PASSWORD:?set it in .env}
    volumes:
      - uploads:/data/uploads
volumes:
  uploads:
