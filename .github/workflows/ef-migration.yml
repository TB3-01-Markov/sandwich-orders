name: Add EF migration
# Helper for adding a SQL Server migration without a local .NET SDK: push a branch called
# "ef-migration-<Name>" and this job runs `dotnet ef migrations add <Name>` and commits the files to that branch.
# With the .NET SDK on your own computer the same command is:
#   $env:Database__Provider="SqlServer"; dotnet ef migrations add <Name> --project src/SandwichOrders.Web --output-dir Data/Migrations
on:
  push:
    branches: ['ef-migration-*']
permissions:
  contents: write
jobs:
  add-migration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef
      - run: dotnet restore
      - name: Add the migration (if it does not exist yet)
        env:
          Database__Provider: SqlServer
          # Only used to choose the provider; adding a migration does not connect to a database.
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=Design;User Id=sa;Password=unused;TrustServerCertificate=True"
        run: |
          NAME="${GITHUB_REF_NAME#ef-migration-}"
          if ls src/SandwichOrders.Web/Data/Migrations/*_"$NAME".cs > /dev/null 2>&1; then
            echo "Migration $NAME already exists."
            exit 0
          fi
          dotnet ef migrations add "$NAME" --project src/SandwichOrders.Web --output-dir Data/Migrations
          git add src/SandwichOrders.Web/Data/Migrations
          git -c user.name="ef-migration" -c user.email="ef-migration@users.noreply.github.com" commit -qm "Add EF migration $NAME (generated by dotnet ef)"
          git push
