name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
      - name: List failed tests
        if: failure()
        run: |
          echo "### Failed tests" >> "$GITHUB_STEP_SUMMARY"
          grep -rhoE 'testName="[^"]+"[^>]*outcome="Failed"' --include=results.trx . | sed -E 's/testName="([^"]+)".*/- \1/' >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
