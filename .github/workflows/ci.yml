name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    name: Build and test (SQLite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then echo "::warning title=Vulnerable packages::$(grep '>' vulnerable.txt | tr '\n' ';' | cut -c1-900)"; fi
      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
      - name: Report failed tests
        if: failure()
        run: python3 .github/scripts/report_failed_tests.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  sql-server:
    name: Tests on SQL Server
    runs-on: ubuntu-24.04
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Test-Passw0rd!" # throw-away server that only lives during this job
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P 'Ci-Test-Passw0rd!' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 20s
    env:
      SQL: "Server=localhost,1433;User Id=sa;Password=Ci-Test-Passw0rd!;TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - name: Every model change has a migration
        env:
          Database__Provider: SqlServer
          ConnectionStrings__DefaultConnection: "${{ env.SQL }};Database=Design"
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations has-pending-model-changes --project src/SandwichOrders.Web --no-build --configuration Release
      - name: Integration tests on SQL Server (one new database per test, created by the migrations)
        env:
          TEST_SQLSERVER: ${{ env.SQL }}
        run: dotnet test tests/SandwichOrders.IntegrationTests --no-build -c Release --logger "trx;LogFileName=sqlserver.trx" --logger "console;verbosity=normal"
      - name: The app starts on SQL Server with the demo data
        env:
          Database__Provider: SqlServer
          ConnectionStrings__DefaultConnection: "${{ env.SQL }};Database=SandwichOrders"
          Seed__Enabled: "true"
          Seed__StaffEmail: staff@example.test
          Seed__StaffPassword: Ci-Staff-1234
        run: |
          nohup dotnet run --project src/SandwichOrders.Web -c Release --no-build --urls http://127.0.0.1:5080 > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5080/health > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:5080/health | grep -q Healthy
          curl -sf http://127.0.0.1:5080/ | grep -q "Smos"
          curl -sf http://127.0.0.1:5080/api/menu/status | grep -q '"sandwiches"'
          echo "Health, menu page and API answer on SQL Server."
      - name: Report failed tests
        if: failure()
        run: |
          python3 .github/scripts/report_failed_tests.py
          if [ -f app.log ]; then echo "::error title=App log (last lines)::$(tail -n 40 app.log | tr '\n' '|' | cut -c1-3000)"; fi

  docker:
    name: Docker image and compose (SQL Server)
    runs-on: ubuntu-24.04
    env:
      MSSQL_SA_PASSWORD: "Ci-Test-Passw0rd!" # throw-away containers that only live during this job
      STAFF_PASSWORD: Ci-Staff-1234
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and start SQL Server + app (docker compose)
        run: docker compose up -d --build
      - name: The app answers (migrations and demo data applied)
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8080/health > /dev/null && break; sleep 3; done
          curl -sf http://localhost:8080/health | grep -q Healthy
          curl -sf http://localhost:8080/ | grep -q "Smos"
          curl -sf http://localhost:8080/api/menu/status | grep -q '"sandwiches"'
      - name: The non-root app user can write photos to the uploads volume
        run: docker compose exec -T web sh -c 'touch /data/uploads/write-test && rm /data/uploads/write-test && whoami'
      - name: After a restart the data is still there (migrations on an existing database)
        run: |
          docker compose restart web
          for i in $(seq 1 40); do curl -sf http://localhost:8080/health > /dev/null && break; sleep 3; done
          curl -sf http://localhost:8080/ | grep -q "Smos"
          echo "Image size: $(docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -i sandwich)"
      - name: Logs when something failed
        if: failure()
        run: echo "::error title=web container log::$(docker compose logs --no-color --tail 60 web | tr '\n' '|' | cut -c1-3000)"
      - if: always()
        run: docker compose down -v
